name: Build Policy
on: [push, pull_request]
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build container
        run: docker build -t unison-policy:ci .
