name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-security:
    uses: project-unisonOS/.github/.github/workflows/reusable-python-security.yml@45118ffb52ee397cf7a510767154ee5b3705a850
    with:
      python-version: "3.12"
      working-directory: "."
      unison-common-ref: "571d5d521d6e534157e856f330371e0030379b07"

  container-supply-chain:
    uses: project-unisonOS/.github/.github/workflows/reusable-container-supply-chain.yml@b8262adfe3ac737ef9fc2e02c337f3983c83c773
    with:
      image-name: unison-policy
      dockerfile: Dockerfile
      context: .
