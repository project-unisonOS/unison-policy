name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-security:
    uses: project-unisonOS/.github/.github/workflows/reusable-python-security.yml@3048602dbf90ab9a61796b46bdeef4463ebd1fc9
    with:
      python-version: "3.12"
      working-directory: "."
      unison-common-ref: "eef1a7353b2c795233daf0db6079b867ff2d98ba"
      enable-principal-binding-test-bypass: true

  container-supply-chain:
    uses: project-unisonOS/.github/.github/workflows/reusable-container-supply-chain.yml@3048602dbf90ab9a61796b46bdeef4463ebd1fc9
    with:
      image-name: unison-policy
      dockerfile: Dockerfile
      context: .
