name: Publish container

on:
  push:
    branches: [ main, "release/**" ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write

jobs:
  publish:
    uses: project-unisonOS/unison-platform/.github/workflows/reusable-build.yml@6b2f2d8f482bd3696a9a0e6df426515c66e73e11
    with:
      image_name: unison-policy
      domain: policy
      service_port: "8083"
    secrets: inherit
