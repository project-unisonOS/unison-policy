name: unison-policy Tests

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'rules.yaml'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'rules.yaml'
      - 'tests/**'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "git+https://github.com/project-unisonOS/unison-common.git@d7ce26691dc187db7f7e2e87f767f4143078d412"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pyyaml

      - name: Run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          OTEL_SDK_DISABLED: "true"
          UNISON_PRINCIPAL_BINDING_TEST_BYPASS: "true"
        run: pytest -q
